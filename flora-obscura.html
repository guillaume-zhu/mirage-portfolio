<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirage Studio | Flora Obscura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div class="noise-overlay"></div>

    <header class="site-header">
      <div class="logo"><img src="./src/assets/img/logo-noir.png" alt="Logo Mirage Studio" /></div>
      <nav><span>Menu</span></nav>
    </header>

    <main id="smooth-wrapper">
      <div id="smooth-content">
        <section class="project-hero">
          <div class="project-hero-heading">
            <p class="project-hero-label">PROJET</p>
            <h1 class="project-hero-title">Flora<br />Obscura</h1>
          </div>
          <div class="project-hero-media">
            <img class="project-hero-image" src="/assets/images/projects/flora-obscura/flora-obscura-main.webp" alt="Flora Obscura" />
          </div>
        </section>

        <section class="project-context">
          <div class="project-context-inner">
            <p class="project-context-label">Aurem Studio</p>
            <div class="project-context-copy">
              <p>Aurem Studio imagine une mode contemporaine où dentelle, transparence et détails floraux occupent une place centrale.</p>
              <p>Pour cette capsule, la marque souhaitait révéler cette délicatesse dans un univers plus inattendu.</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/projectPageMain.js"></script>
  </body>
</html>
